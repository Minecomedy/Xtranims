# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually (it's hardcoded below).
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.1
group=com.minecomedy.xtranims
java_version=17

# Common
minecraft_version=1.20.1
mod_name=XtraNimations
mod_author=Minecomedy
mod_id=xtranims
license=MIT
credits=Claude
description=Adds extra animation triggers and RGB color sync to Customizable Player Models (CPM).
minecraft_version_range=[1.20.1, 1.21)

# Parchment (layered on top of official Mojang mappings)
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge (using legacyForge via NeoForged ModDevGradle — same 1.20.1 Forge underneath)
forge_version=47.4.13
forge_loader_version_range=[47,)

# CPM
cpm_version=0.6.25

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
