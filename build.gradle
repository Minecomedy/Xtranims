plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.77'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'tom5454'
        url = 'https://raw.githubusercontent.com/tom5454/maven/main'
    }
}

neoForge {
    version = "${neoforge_version}"

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion  = parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // Drop the CPM NeoForge 1.21 jar into run/mods/ before running
        }
        server {
            server()
            gameDirectory = project.file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // CPM NeoForge 1.21 jar — place in run/mods/ (same pattern as 1.20.1 project)
    // NeoForge picks it up automatically at runtime from the run/mods/ directory.
    compileOnly fileTree(dir: 'run/mods', include: ['CustomPlayerModels-NeoForge-*.jar', 'CustomPlayerModels-*.jar'])
}

processResources {
    var expandProps = [
        'version'                      : version,
        'group'                        : project.group,
        'mod_name'                     : mod_name,
        'mod_author'                   : mod_author,
        'mod_id'                       : mod_id,
        'license'                      : license,
        'description'                  : description,
        'credits'                      : credits,
        'neoforge_version'             : neoforge_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'minecraft_version'            : minecraft_version,
        'minecraft_version_range'      : minecraft_version_range,
        'java_version'                 : java_version
    ]
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet  = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}
